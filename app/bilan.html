<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mon bilan visibilité - Mon Photographe Bébé</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@200;300;400;600;700&family=Nothing+You+Could+Do&family=Great+Vibes&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{/* Charte Mon Photographe Bébé */--accent:#9B2F45;--accent-fonce:#7F2538;--accent-doux:#F6DCE0;--rose:#9B2F45;--encre:#474746;--texte:#5F5F5D;--discret:#737371;--trait:#EBDCDA;--surface:#FBF5F3;--fond:#FFFFFF;--rose-pastel:#F6DCE0;--rose-voile:rgba(246,220,224,.45);--peche:#FCE2D2;--sauge:#E2ECE1;--gris-bouton:#F3EEEC;--manuscrit:"Nothing You Could Do",cursive;
--bien:#9B2F45;--bien-doux:#E2ECE1;--attention:#9A6410;--attention-doux:#FBF0DC;--critique:#B8323A;--critique-doux:#FBE7E8;--rayon:8px;
--police:"Mulish",system-ui,"Segoe UI","Helvetica Neue",Arial,sans-serif}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--fond);color:var(--encre);font-family:var(--police);font-size:15px;line-height:1.55}
h1,h2,h3{line-height:1.25;margin:0;text-wrap:balance}
h1{font-size:2rem;font-weight:300;letter-spacing:-.01em}h2{font-size:1.3rem;font-weight:600}h3{font-size:1.02rem;font-weight:600}
.manuscrit{font-family:var(--manuscrit);font-weight:400;font-size:1.12em;color:var(--accent);white-space:nowrap}.surligne{background:linear-gradient(transparent 52%,var(--rose-pastel) 52%,var(--rose-pastel) 90%,transparent 90%);padding:0 6px}
p{margin:0}a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.discret{color:var(--discret)}.petit{font-size:.85rem}
.conteneur{max-width:1180px;margin:0 auto;width:100%;padding:0 16px}
.equerre{position:relative;display:inline-block;align-self:flex-start;padding:0 .9rem .35rem 0}
.equerre:after{content:"";position:absolute;right:0;bottom:0;width:1.1rem;height:.9rem;border-right:2px solid var(--rose);border-bottom:2px solid var(--rose)}
.entete{border-bottom:1px solid var(--trait);background:var(--fond);position:sticky;top:0;z-index:10}
.entete .conteneur{display:flex;align-items:center;gap:1rem;min-height:68px;flex-wrap:wrap;padding-block:.5rem}
.logo{display:flex;flex-direction:column;align-items:center;line-height:1}
.logo .s{font-size:10px;letter-spacing:2px}.logo .m{font-size:15px;letter-spacing:1.5px;font-weight:500}.logo .b{font-family:'Great Vibes',cursive;font-size:28px;margin-top:-4px}
.entete nav{display:flex;gap:.25rem;margin-left:auto;flex-wrap:wrap;align-items:center}
.lien-nav{padding:.45rem .8rem;border-radius:6px;text-decoration:none;color:var(--encre);font-weight:500;font-size:.9rem;border:0;background:none;cursor:pointer}
.lien-nav:hover{background:var(--surface)}
.lien-nav[aria-current=page]{background:var(--rose-voile);color:var(--accent);font-weight:600}
main{padding-block:2rem 4rem}
.bouton{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;border-radius:999px;padding:.7rem 1.2rem;font-weight:600;border:1px solid transparent;cursor:pointer;text-decoration:none;font-size:.95rem}
.bouton.principal{background:var(--accent);color:#fff}.bouton.principal:hover{background:var(--accent-fonce)}
.bouton.secondaire{background:var(--gris-bouton);color:var(--encre);border-color:var(--gris-bouton)}.bouton.secondaire:hover{border-color:var(--accent)}
.bouton:disabled{opacity:.45;cursor:not-allowed}
.bouton.petit-btn{padding:.4rem .75rem;font-size:.85rem}
.carte{background:var(--fond);border:1px solid var(--trait);border-radius:var(--rayon);padding:1.25rem}
.encart{background:var(--surface);border-radius:var(--rayon);padding:1rem 1.25rem}
.badge{display:inline-flex;align-items:center;gap:.3rem;font-size:.72rem;font-weight:600;letter-spacing:.02em;padding:.18rem .55rem;border-radius:999px;white-space:nowrap}
.badge.ok{background:var(--bien-doux);color:var(--bien)}.badge.att{background:var(--attention-doux);color:var(--attention)}.badge.ko{background:var(--critique-doux);color:var(--critique)}.badge.info{background:var(--surface);color:var(--discret)}.badge.pts{background:var(--accent-doux);color:var(--accent)}
.jauge{height:6px;border-radius:999px;background:var(--trait);overflow:hidden}.jauge>span{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .4s ease}.jauge.complete>span{background:var(--bien)}
.pile{display:flex;flex-direction:column;gap:1rem}
.ligne{display:flex;gap:.75rem;align-items:center;flex-wrap:wrap}
.entre{justify-content:space-between}
.studio{border:2px solid var(--accent);border-radius:16px;background:linear-gradient(180deg,var(--rose-voile),var(--fond) 220px);padding:1.5rem;display:flex;flex-direction:column;gap:1.1rem;margin-top:1rem}
.studio-tete{display:flex;justify-content:space-between;gap:1rem;align-items:flex-start}
.studio-tete h2{font-size:1.6rem;margin:.35rem 0 .3rem;font-weight:300}
.studio-badge{display:inline-block;background:var(--accent-doux);color:var(--accent);font-weight:600;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;padding:.25rem .6rem;border-radius:6px;border:1px solid var(--trait)}
.studio-logo{flex:none;width:78px;height:78px;border-radius:50%;background:var(--rose-pastel);display:grid;place-items:center;color:var(--accent)}
.studio-logo svg{width:40px;height:40px}
.studio-bloc{background:var(--fond);border:1px solid var(--trait);border-radius:12px;padding:1.1rem 1.2rem;display:grid;grid-template-columns:1fr auto;gap:.6rem 1rem}
.studio-bloc>*{min-width:0}
.studio-bloc>:not(.studio-pastille){grid-column:1}
.studio-bloc h3{margin:0;font-size:1.05rem}
.studio-pastille{width:48px;height:48px;border-radius:50%;background:var(--accent-doux);color:var(--accent);display:grid;place-items:center;grid-row:span 3;align-self:start}
.studio-pastille svg{width:24px;height:24px}
.studio-bloc .champ{margin:0}
.studio-aide{font-size:.82rem;color:var(--discret);margin:0}
.studio-res{background:var(--surface);border:1px solid var(--trait);border-radius:14px;padding:1rem;display:flex;flex-direction:column;gap:.2rem}
.studio-actions{display:flex;flex-wrap:wrap;gap:.6rem;margin-bottom:.6rem}
.studio-pill{display:inline-flex;align-items:center;gap:.45rem;border-radius:999px;padding:.5rem 1rem;font-weight:600;font-size:.9rem;background:rgba(246,220,224,.75);color:var(--accent);border:0}
button.studio-pill{background:var(--rose-voile);font-weight:500;cursor:pointer}
button.studio-pill:hover{background:rgba(246,220,224,.75)}
.studio-pill svg{width:18px;height:18px}
.studio-ligne{display:grid;grid-template-columns:minmax(0,13rem) minmax(0,1fr);gap:1rem;padding:.9rem .4rem;border-top:1px solid var(--trait)}
.studio-ligne:first-of-type{border-top:0}
.studio-lib{display:flex;gap:.8rem;align-items:flex-start}
.studio-lib .studio-pastille{width:44px;height:44px;border-radius:12px;grid-row:auto}
.studio-lib strong{display:block}
.studio-lib span{font-size:.8rem;color:var(--discret)}
.studio-boite{background:var(--fond);border:1px solid var(--trait);border-radius:10px;padding:.9rem 1rem;display:flex;gap:.8rem;justify-content:space-between;align-items:flex-start}
.studio-boite p{margin:0;white-space:pre-wrap}
.studio-boite.visuel{background:var(--rose-voile);border-color:var(--trait);color:var(--accent);justify-content:flex-start;align-items:center}
.studio-boite .copier{flex:none;display:inline-flex;align-items:center;gap:.35rem;border:1px solid var(--trait);background:var(--fond);border-radius:8px;padding:.4rem .7rem;font-size:.85rem;cursor:pointer}
.studio-boite .copier:hover{border-color:var(--accent)}
.studio-champ-pied{display:flex;justify-content:space-between;align-items:flex-start;gap:.8rem;flex-wrap:wrap}
.calc-champs{grid-column:1/-1;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:.7rem 1rem}.calc-champs .champ{margin:0}.calc-large{grid-column:1/-1}.calc-champs label{font-size:.9rem;font-weight:600}.calc-tab,.calc-detail{display:grid;gap:.35rem;overflow-x:auto}.calc-tr{display:grid;grid-template-columns:minmax(140px,2fr) repeat(auto-fit,minmax(90px,1fr));gap:.4rem;align-items:center}.calc-th{font-size:.8rem;color:var(--discret);font-weight:600}.calc-tr input,.calc-tr select{width:100%;min-width:0}.calc-grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:.6rem}.calc-kpi{background:var(--fond);border:1px solid var(--trait);border-radius:10px;padding:.7rem .8rem;display:grid;gap:.2rem}.calc-kpi span{font-size:.85rem;color:var(--discret)}.calc-kpi strong{font-size:1.25rem;font-variant-numeric:tabular-nums}.calc-kpi small{font-size:.8rem;color:var(--discret)}.calc-kpi.fort{border-color:var(--accent);background:var(--rose-voile)}.calc-res{display:grid;gap:.8rem}.portrait{background:var(--rose-voile);border-color:transparent}.portrait-recit{font-size:1.08rem;line-height:1.7;color:var(--encre)}.signes{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:1rem}.signe{border:1px solid var(--trait);border-radius:16px;padding:1.2rem 1.3rem;display:grid;gap:.45rem;align-content:start;background:var(--fond)}.signe-n{font-size:2rem;font-weight:200;color:var(--accent);line-height:1}.signe h3{font-size:1.05rem}.signe-idee{background:var(--surface);border-radius:10px;padding:.55rem .7rem}.calc-champs select,.calc-tr select,.calc-tr input{font:inherit;padding:.55rem .6rem;border:1px solid var(--trait);border-radius:8px;background:var(--fond);color:inherit;min-height:2.6rem}.calc-detail{font-variant-numeric:tabular-nums;font-size:.9rem;border-top:1px solid var(--trait);padding-top:.6rem}
.pastille-couleur{display:inline-block;width:1em;height:1em;border-radius:4px;border:1px solid var(--trait);vertical-align:-.15em;margin-right:.3em}.studio-photos{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:.6rem}.studio-photos figure{margin:0;display:grid;gap:.2rem;justify-items:center}.studio-photos img{width:92px;height:92px;object-fit:cover;border-radius:8px;border:1px solid var(--trait)}.studio-ajout{width:92px;height:92px;border:1px dashed var(--accent);border-radius:8px;display:grid;place-content:center;justify-items:center;gap:.2rem;color:var(--accent);font-size:.85rem;font-weight:600;cursor:pointer}.studio-ajout:focus-within{outline:2px solid var(--accent)}
.studio-questions{border-color:var(--accent)}.studio-questions>*:not(h3):not(.studio-pastille){grid-column:1/-1}.studio-q{padding-top:.8rem;border-top:1px dashed var(--trait)}.studio-q label{display:block;margin-bottom:.2rem}.studio-q .studio-aide{margin:.1rem 0 .4rem}
.micro{display:inline-flex;align-items:center;gap:.4rem;border:1px solid var(--accent);color:var(--accent);background:var(--fond);border-radius:999px;padding:.35rem .8rem;font-size:.85rem;font-weight:600;cursor:pointer;flex:none}
.micro svg{width:16px;height:16px}
.micro:hover{background:var(--accent-doux)}
.micro[aria-pressed="true"]{background:var(--accent);color:#fff;animation:micro-pulse 1.4s ease-in-out infinite}
@keyframes micro-pulse{50%{box-shadow:0 0 0 6px rgba(155,47,69,.18)}}
@media (prefers-reduced-motion:reduce){.micro[aria-pressed="true"]{animation:none}}
.studio-note{font-size:.8rem;color:var(--discret);margin-top:.4rem}
.studio-plus{background:var(--fond);border:1px solid var(--trait);border-radius:12px;padding:1rem 1.2rem;display:flex;gap:1rem;align-items:flex-start}
.studio-plus h3{margin:0;color:var(--accent);font-size:1rem}
@media (max-width:640px){.studio{padding:1rem}.studio-ligne{grid-template-columns:1fr}.studio-logo{width:56px;height:56px}.studio-logo svg{width:28px;height:28px}.studio-bloc{grid-template-columns:1fr}.studio-bloc .studio-pastille{display:none}.studio-boite:not(.visuel){flex-direction:column}.studio-boite .copier{align-self:flex-end}}
/* Mon studio de contenu : bouton fixe et panneau latéral, selon la charte Mon Photographe Bébé */
.sc-onglet{position:fixed;right:12px;top:50%;transform:translateY(-50%);z-index:40;writing-mode:vertical-rl;rotate:180deg;display:flex;align-items:center;gap:10px;background:var(--accent);color:#fff;border:0;border-radius:999px;padding:22px 13px;font-family:var(--police);font-weight:600;font-size:13px;letter-spacing:.07em;text-transform:uppercase;cursor:pointer}
.sc-onglet:hover{background:var(--accent-fonce)}
.sc-onglet:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.sc-onglet .ico{color:#fff;width:18px;height:18px;rotate:90deg}
.bouton.principal .ico{color:#fff}
.sc-voile{position:fixed;inset:0;background:rgba(71,71,70,.28);z-index:50}
.sc{position:fixed;top:0;right:0;bottom:0;width:min(800px,100vw);background:var(--fond);z-index:51;display:flex;flex-direction:column;box-shadow:0 12px 32px rgba(155,47,69,.10);font-weight:300;color:var(--texte)}
.sc strong,.sc h3,.sc label strong{color:var(--encre)}
.sc-tete{position:relative;overflow:hidden;display:flex;align-items:flex-start;gap:1rem;padding:28px 40px 22px;border-bottom:1px solid var(--trait);background:var(--fond)}
.sc-angle{position:absolute;right:0;top:0;width:230px;height:140px;pointer-events:none}
.sc-angle .a{fill:var(--peche)}.sc-angle .l{fill:none;stroke:var(--accent);stroke-width:1.5;stroke-linecap:round}
.sc-titres{position:relative;z-index:1}
.sc-surtitre{margin:0 0 10px;display:flex;align-items:center;gap:14px;font-size:13px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--accent)}
.sc-surtitre span{display:inline-block;width:56px;height:1px;background:var(--accent)}
.sc-tete h2{position:relative;display:inline-block;font-weight:200;font-size:34px;line-height:1.2;color:var(--encre);margin:0}
.sc-tete h2 .manuscrit{font-size:1.12em}
.sc-traits{position:absolute;right:-40px;top:-18px;width:34px;height:30px;color:var(--accent)}
.sc-fermer{position:relative;z-index:1;margin-left:auto;border:0;background:var(--gris-bouton);border-radius:999px;width:42px;height:42px;font-size:1.3rem;font-weight:300;cursor:pointer;color:var(--encre)}
.sc-fermer:hover{background:var(--accent-doux)}
.sc-corps{overflow-y:auto;padding:24px 40px 64px;display:flex;flex-direction:column;gap:20px;flex:1;background:var(--surface)}
.sc-chapeau{margin:0;font-size:16px;line-height:1.7;font-weight:300;color:var(--texte)}
.sc-avert{display:flex;gap:14px;align-items:flex-start;background:var(--fond);border-radius:18px;padding:16px 18px;font-size:14px;line-height:1.6;box-shadow:0 12px 32px rgba(155,47,69,.10)}
.sc-avert .sc-pastille{background:var(--peche)}
.sc-avert strong{color:var(--accent);font-weight:600}
.sc-pastille{flex:none;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;color:var(--accent);background:var(--rose)}
.sc-pastille .ico{width:22px;height:22px;color:var(--accent);stroke-width:1.5}
.sc-etape{background:var(--fond);border-radius:24px;padding:22px 24px;display:flex;flex-direction:column;gap:14px;box-shadow:0 12px 32px rgba(155,47,69,.10)}
.sc-etape-tete{display:flex;align-items:baseline;gap:16px}
.sc-num{font-weight:200;font-size:44px;line-height:1;color:var(--accent);flex:none;min-width:56px}
.sc-etape h3{font-weight:600;font-size:19px;line-height:1.3;color:var(--encre);margin:0}
.sc .studio-aide{font-size:14px;color:var(--discret);font-weight:300}
.sc .choix label{border-radius:999px;padding:.55rem 1rem;font-weight:300}
.sc .choix label:has(input:checked){border-color:var(--accent);background:var(--rose-voile)}
.sc .choix.colonne label{border-radius:14px}
.sc .bouton{font-size:13px;letter-spacing:.07em;text-transform:uppercase;padding:15px 22px}
.sc .bouton.petit-btn{padding:11px 18px;font-size:12px}
.sc .champ input,.sc .champ textarea{border-radius:14px;font-weight:300}
.sc-piliers{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px}
.sc-pilier{text-align:left;border:1px solid var(--trait);background:var(--fond);border-radius:18px;padding:14px 16px;cursor:pointer;display:flex;flex-direction:column;gap:4px;font-family:var(--police)}
.sc-pilier strong{font-size:15px;font-weight:600}.sc-pilier span{font-size:13px;line-height:1.5;color:var(--discret);font-weight:300}
.sc-pilier:hover{border-color:var(--accent)}
.sc-pilier[aria-pressed="true"]{border-color:var(--accent);background:var(--rose-voile)}
.sc-sujets{display:flex;flex-direction:column;gap:10px}
.sc-sujet{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:start;border:1px solid var(--trait);border-radius:18px;padding:12px 16px;cursor:pointer;background:var(--fond)}
.sc-sujet:hover{border-color:var(--accent)}
.sc-sujet:has(input:checked){border-color:var(--accent);background:var(--rose-voile)}
.sc-sujet input{accent-color:var(--accent);margin:.3rem 0 0}
.sc-sujet strong{display:block;font-size:15px;font-weight:600}.sc-sujet>span>span{font-size:13px;color:var(--discret)}
.sc-sujet .sc-fait{display:inline-block;margin-left:.5rem;font-size:11px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--accent);background:var(--sauge);border-radius:999px;padding:2px 10px;vertical-align:middle}
.sc-edit{display:grid;grid-template-columns:1fr auto;gap:8px 12px;align-items:start;padding:12px 0;border-top:1px solid var(--trait)}
.sc-edit input,.sc-edit textarea{border:1px solid var(--trait);border-radius:14px;padding:.55rem .85rem;width:100%;font-size:15px;font-weight:300;background:var(--fond);font-family:var(--police)}
.sc-edit textarea{min-height:76px;resize:vertical;grid-column:1}
.sc-retouches{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:4px 0 8px}
.sc-retouches span{font-size:13px;letter-spacing:.16em;text-transform:uppercase;font-weight:600;color:var(--accent);margin-right:4px}
.sc-retouches button{border:0;background:var(--gris-bouton);border-radius:999px;padding:11px 18px;font-size:12px;font-weight:600;letter-spacing:.07em;text-transform:uppercase;color:var(--encre);cursor:pointer;font-family:var(--police)}
.sc-retouches button:hover{background:var(--accent-doux)}
.sc .studio-res{background:var(--fond);border:0;border-radius:24px;box-shadow:0 12px 32px rgba(155,47,69,.10)}
.sc .message.att{background:var(--peche);color:var(--encre)}.sc .message.att strong{color:var(--accent)}
body.sc-ouvert{overflow:hidden}
@media (max-width:640px){
  .sc-onglet{writing-mode:horizontal-tb;rotate:none;top:auto;bottom:16px;right:16px;transform:none;padding:15px 20px}
  .sc-onglet .ico{rotate:none}
  .sc-tete{padding:20px 24px 18px}.sc-tete h2{font-size:28px}.sc-angle{width:150px;height:92px}.sc-traits{display:none}
  .sc-corps{padding:20px 16px 72px}.sc-etape{padding:18px;border-radius:18px}.sc-num{font-size:34px;min-width:40px}
}
.message{border-radius:var(--rayon);padding:.8rem 1rem;font-size:.9rem}
.message.erreur{background:var(--critique-doux);color:var(--critique)}.message.ok{background:var(--bien-doux);color:var(--bien)}.message.att{background:var(--attention-doux);color:var(--attention)}
.accueil-tete{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:2.5rem;align-items:center;padding-block:1.5rem 2.5rem}
.accueil-tete h1{font-size:clamp(2rem,4.4vw,2.9rem);font-weight:200;color:var(--encre);letter-spacing:-.01em;line-height:1.18}
.accueil-tete .chapo{font-size:1.08rem;margin-top:1rem;max-width:60ch}
.etapes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:1rem;counter-reset:etape}
.etape{counter-increment:etape;border-top:2px solid var(--accent);padding-top:.9rem}
.etape:before{content:counter(etape);font-weight:200;color:var(--rose);font-size:1.4rem;display:block;margin-bottom:.2rem}
@media(max-width:760px){.accueil-tete{grid-template-columns:1fr}}
.candidat-grille{display:grid;grid-template-columns:270px minmax(0,1fr);gap:2rem;align-items:start}
@media(max-width:860px){.candidat-grille{grid-template-columns:1fr}}
.sommaire{position:sticky;top:90px;display:flex;flex-direction:column;gap:.2rem}
@media(max-width:860px){.sommaire{position:static}}

/* =====================================================================
   HARMONISATION : une seule charte pour tout le module (charte Mon Photographe Bébé)
   Typo fine, sur-titres bordeaux avec trait, titres extra-fins, boutons pilule en majuscules,
   cartes blanches aux grands arrondis avec l'ombre douce, pastels en touches, jamais de dégradé.
   Ce bloc vient en dernier : il prime sur les styles plus anciens.
   ===================================================================== */
:root{--ombre:0 12px 32px rgba(155,47,69,.10);--r-carte:24px;--r-moyen:18px;--r-champ:14px;--rose-p:#F6DCE0}
body{font-weight:300;color:var(--texte);font-size:16px;line-height:1.65}
strong,b,h1,h2,h3,label{color:var(--encre)}
h1{font-weight:200;font-size:clamp(30px,3.4vw,42px);line-height:1.2;letter-spacing:-.01em}
h2{font-weight:200;font-size:clamp(22px,2.2vw,28px);line-height:1.25}
h3{font-weight:600;font-size:17px;line-height:1.35}
.discret{color:var(--discret)}
main{padding-block:2.5rem 5rem}

/* En-tête du site */
.entete{background:rgba(255,255,255,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--trait)}
.lien-nav{font-weight:600;font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--encre);border-radius:999px;padding:9px 14px}
.lien-nav:hover{background:var(--surface)}
.lien-nav[aria-current=page]{background:var(--rose-voile);color:var(--accent)}

/* Titres de page : extra-fin, et les traits d'énergie à la place de l'équerre */

<script>
// ===== CONFIGURATION =====
const SUPABASE_URL = "https://htyvaqxdfptgswvwqplq.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh0eXZhcXhkZnB0Z3N3dndxcGxxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTIxNTI4NTQsImV4cCI6MjEwNzcyODg1NH0.kwwMUTi-1WasIaSqoZt4-cxS6qVFEnx9Vz5brGWO1nM";
// =========================

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const app = document.getElementById("app");
const NOMS = { F: "Ma fiche Mon Photographe Bébé", G: "Être trouvé sur Google et dans les IA", S: "Faire réserver depuis son site", R: "Communiquer sur les réseaux sociaux", N: "Réseau et recommandations" };
const ORDRE = ["F", "G", "S", "R", "N"];
const S = { cat: null, bilan: null, rep: new Map(), constats: [], section: "contexte", complet: false, result: null, sauve: null };

const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const val = (id) => S.rep.get(id)?.valeur || [];
const extra = (id) => S.rep.get(id)?.texte_libre || {};
const badgeNiveau = (n) => n === "Bien en place" ? "ok" : n === "À compléter" ? "att" : n === "À construire" ? "ko" : "info";
const SUPPORTS = [["instagram", "Instagram"], ["facebook", "Facebook"], ["tiktok", "TikTok"], ["pinterest", "Pinterest"], ["linkedin", "LinkedIn"], ["google", "Google (fiche Google Maps)"], ["site", "Le référencement de votre site"], ["mpb", "Mon Photographe Bébé"], ["bao", "Le bouche-à-oreille"]];
const PUB = { plateformes: [["google-ads", "Google Ads"], ["meta", "Publicité Meta (Facebook, Instagram)"], ["autre", "Autre plateforme"]],
  budgets: [["<50", "Moins de 50 €"], ["50-150", "50 à 150 €"], ["150-300", "150 à 300 €"], ["300-500", "300 à 500 €"], [">500", "Plus de 500 €"]],
  mesures: [["oui", "Oui, je sais combien de demandes et de réservations elle m'apporte"], ["approx", "À peu près"], ["non", "Non, je ne mesure pas"]] };
const p10Complet = () => { const v = val("P10"), ex = extra("P10"); return v.includes("aucune") || (v.length > 0 && !!ex.budget && !!ex.mesure); };
const p09Complet = () => SUPPORTS.every(([k]) => extra("P09")[k] !== undefined);
const LBL = { A: ["Bien en place", "ok"], B: ["À compléter", "att"], C: ["À construire", "ko"], U: ["Non vérifiable", "info"] };

// ---------- Contexte et applicabilité (miroir du moteur de règles) ----------
function ctx() {
  return { specialites: val("P01"), hasSite: val("P04").includes("site"), hasSocial: val("P04").includes("social"),
    hasFiche: !!extra("P04").fiche_url, hasClients: extra("P03").a_des_clients !== false, p08: extra("P08") };
}
function applicable(q) {
  const c = ctx(), g01v = val("G01");
  const ficheGoogle = g01v.some((x) => /^c[1-9]$/.test(x)) || (["A", "B"].includes(g01v[0]) && !g01v.includes("c0"));

  if (cond.includes("clients") && !c.hasClients) return false;
  if (cond.includes("plusieurs prestations") && c.specialites.length < 2) return false;
  if (/\bg01\b/.test(cond) && !ficheGoogle) return false;
  if (cond.includes("wordpress") && !val("G19").includes("wordpress")) return false;
  return true;
}

async function callFn(name, body) {

function libelleReponse(q) {

function urlVideo(u) {
  const y = u.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{11})/); if (y) return "https://www.youtube-nocookie.com/embed/" + y[1];

function renderRessources(ressources, enPlace = null, medias = []) {

// Réduit une image à 1024 px (JPEG) avant l'envoi à notre studio de création
function reduireImage(fichier) {
  return new Promise((ok, ko) => {
    const url = URL.createObjectURL(fichier); const img = new Image();
    img.onload = () => {
      const k = Math.min(1, 1024 / Math.max(img.width, img.height)); const c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      const d = c.toDataURL("image/jpeg", 0.82); URL.revokeObjectURL(url);
      ok({ media_type: "image/jpeg", data: d.split(",")[1], apercu: d });
    };
    img.onerror = () => { URL.revokeObjectURL(url); ko(new Error("image")); };
    img.src = url;
  });
}

    for (const f of [...fichiers.files].slice(0, 6 - st.images.length)) { try { st.images.push(await reduireImage(f)); } catch { st.err = "Une image n'a pas pu être lue."; } }
    st.questions = null; renderStudio(zone, id);
  };
  zone.querySelectorAll("[data-retirer]").forEach((b) => b.onclick = () => { st.images.splice(+b.dataset.retirer, 1); st.questions = null; renderStudio(zone, id); });
  const imagesEnvoyees = () => (avecImages ? st.images.map(({ media_type, data }) => ({ media_type, data })) : undefined);
  const reponsesDonnees = () => (st.questions || []).map((q, i) => ({ question: q.question, reponse: (st.reponses[i] || "").trim() })).filter((x) => x.reponse);
  const preparer = async () => {
    arreterDictee(); st.charge = true; st.prepa = true; st.err = ""; renderStudio(zone, id);
    let direct = false;
    try {
      const q = await callFn(ag.fn, { mission_id: id, format: fmt, persona: st.persona, brief: st.brief, images: imagesEnvoyees(), etape: "questions" });
      if (q.suffisant || !q.questions?.length) direct = true; else { st.questions = q.questions; st.reponses = {}; }

    try {
      const r = await callFn(ag.fn, { mission_id: id, format: fmt, persona: st.persona, brief: st.brief, images: imagesEnvoyees(), reponses: avecReponses ? reponsesDonnees() : [] });
      st.courant = { id: r.id, created_at: r.created_at, resultat: r.resultat, alertes: r.alertes || [], persona_prenom: st.persona === "toutes" ? "Tous mes personas" : pers[st.persona]?.prenom };
      await chargerHistoriqueStudio(id);
    } catch (e) { st.err = e.message || "Notre studio de création n'a pas pu répondre, réessayez dans un instant."; }
    st.charge = false; renderStudio(zone, id);
    if (st.courant) zone.querySelector("#studio-res")?.scrollIntoView({ behavior: "smooth", block: "start" });
  };
  const go = zone.querySelector("#studio-go"); if (go) go.onclick = preparer;
  const red = zone.querySelector("#studio-rediger"); if (red) red.onclick = () => lancer(true);
  const passer = zone.querySelector("#studio-passer"); if (passer) passer.onclick = () => lancer(false);
  const encore = zone.querySelector("#studio-encore"); if (encore) encore.onclick = () => lancer(true);
  zone.querySelectorAll("[data-hist]").forEach((b) => b.onclick = () => { const h = st.hist.find((x) => x.id === b.dataset.hist); if (h) { st.courant = { ...h, alertes: [] }; renderStudio(zone, id); zone.querySelector("#studio-res")?.scrollIntoView({ behavior: "smooth", block: "start" }); } });
  const copier = async (b, txt) => { const avant = b.innerHTML; try { await navigator.clipboard.writeText(txt); b.lastChild.textContent = "Copié"; } catch { b.lastChild.textContent = "Sélectionnez le texte"; } setTimeout(() => (b.innerHTML = avant), 2000); };
  zone.querySelectorAll("[data-copie]").forEach((b) => b.onclick = () => copier(b, b.closest(".studio-boite").querySelector(".texte-studio").textContent));
  zone.querySelectorAll("[data-copie-tout]").forEach((b) => b.onclick = () => copier(b, zone.querySelector(".cache-copie").value));
  if (st.hist === null) chargerHistoriqueStudio(id).then(() => { if (document.body.contains(zone)) renderStudio(zone, id); });
}

async function scAppel(type, body, apres) {

function scChargerPiliers(regenerer = false) {
  const st = sc();

function scChargerSujets(encore = false) {
  const st = sc(); const p = st.data.piliers[st.cle][st.pilier]; const k = `${st.cle}|${p.titre}`;
  if (!encore && st.sujets[k]) return;

function scRecu(r) {

function scBrancher(zone) {

    zone.querySelectorAll("[data-sc-ed-x]").forEach((b) => b.onclick = () => { st.edit.liste.splice(+b.dataset.scEdX, 1); renderStudioContenu(); });
    const plus = zone.querySelector("[data-sc-ed-plus]"); if (plus) plus.onclick = () => { st.edit.liste.push({ titre: "", description: "" }); renderStudioContenu(); zone.querySelector(`[data-sc-ed-t="${st.edit.liste.length - 1}"]`)?.focus(); };
    const an = zone.querySelector("[data-sc-ed-annuler]"); if (an) an.onclick = () => { st.edit = null; renderStudioContenu(); };
    const ok = zone.querySelector("[data-sc-ed-ok]"); if (ok) ok.onclick = () => {
      const liste = st.edit.liste.filter((p) => p.titre.trim());
      if (!liste.length) { st.err = "Gardez au moins un pilier."; return renderStudioContenu(); }
      scAppel("piliers-maj", { action: "piliers_maj", cle: st.cle, piliers: liste }, (r) => { st.data.piliers = r.piliers; st.edit = null; st.pilier = null; st.sujet = null; });
    };
  }
  zone.querySelectorAll('input[name="sc-sujet"]').forEach((r) => r.onchange = () => { const k = `${st.cle}|${st.data.piliers[st.cle][st.pilier].titre}`; st.sujet = st.sujets[k][+r.value]; st.perso = ""; const i = zone.querySelector("#sc-perso"); if (i) i.value = ""; const b = zone.querySelector("[data-sc-rediger]"); if (b) b.disabled = false; });
  const pe = zone.querySelector("#sc-perso"); if (pe) pe.oninput = () => { st.perso = pe.value; if (pe.value.trim()) { st.sujet = null; zone.querySelectorAll('input[name="sc-sujet"]').forEach((x) => (x.checked = false)); } const b = zone.querySelector("[data-sc-rediger]"); if (b) b.disabled = !(st.sujet || st.perso.trim()); };
  const de = zone.querySelector("#sc-detail"); if (de) de.oninput = () => (st.detail = de.value);
  brancherDictee(zone, (t) => { if (t.id === "sc-detail") st.detail = t.value; });
  const enc = zone.querySelector("[data-sc-encore]"); if (enc) enc.onclick = () => scChargerSujets(true);
  const rd = zone.querySelector("[data-sc-rediger]"); if (rd) rd.onclick = () => {
    const sujet = st.perso.trim() ? { titre: st.perso.trim(), angle: "" } : st.sujet;
    scRediger({ cle: st.cle, pilier: st.data.piliers[st.cle][st.pilier], sujet, reseau: st.reseau, format: st.format, detail: st.detail });
  };
  const encore = zone.querySelector("#studio-encore"); if (encore) encore.onclick = () => { const b = st.courant?.brief?.studio; if (b) scRediger(b); };
  zone.querySelectorAll("[data-sc-retouche]").forEach((b) => b.onclick = () => scAppel("rediger", { action: "retoucher", id: st.courant.id, consigne: b.dataset.scRetouche }, scRecu).then(() => scVers("#studio-res")));
  zone.querySelectorAll("[data-sc-hist]").forEach((b) => b.onclick = () => { const h = st.data.historique.find((x) => x.id === b.dataset.scHist); if (h) { st.courant = { ...h, alertes: [] }; renderStudioContenu(); scVers("#studio-res"); } });
  const copier = async (b, txt) => { const avant = b.innerHTML; try { await navigator.clipboard.writeText(txt); b.lastChild.textContent = "Copié"; } catch { b.lastChild.textContent = "Sélectionnez le texte"; } setTimeout(() => (b.innerHTML = avant), 2000); };
  zone.querySelectorAll("[data-copie]").forEach((b) => b.onclick = () => copier(b, b.closest(".studio-boite").querySelector(".texte-studio").textContent));
  zone.querySelectorAll("[data-copie-tout]").forEach((b) => b.onclick = () => copier(b, zone.querySelector(".cache-copie").value));
}

// Persona découpé en rubriques (colonne sous_bloc) : un sommaire cliquable, puis une rubrique après l'autre
function rubriquesPersona(o) {
  const rub = []; for (const q of o.qs) { const t = q.sous_bloc || "Votre persona"; let r = rub.find((x) => x.t === t); if (!r) rub.push(r = { t, qs: [] }); r.qs.push(q); }
  let n = 0;
  const fait = (r) => r.qs.filter((q) => estRepondue(S.ident.reponses[cleId(q, o.spe)])).length;
  const prenom = (S.ident.reponses[cleId({ id: "PE01" }, o.spe)]?.c || [])[0]?.trim();
  return `<nav class="rq-nav" aria-label="Rubriques du persona">${rub.map((r, k) => `<a href="#rq-${k}" class="rq-puce ${fait(r) === r.qs.length ? "fait" : ""}"><span class="rq-n">${String(k + 1).padStart(2, "0")}</span>${esc(r.t)}<span class="rq-c">${fait(r)}/${r.qs.length}</span></a>`).join("")}</nav>
    ${rub.map((r, k) => `<section class="rq-rubrique" id="rq-${k}"><div class="rq-tete"><span class="rq-num">${String(k + 1).padStart(2, "0")}</span><div><p class="rq-sur">Rubrique ${k + 1} sur ${rub.length}</p><h2>${esc(r.t)}</h2></div><span class="rq-pour">${ico("personne", "")}Pour <b class="rq-prenom">${esc(prenom || "votre client rêvé")}</b><span>· séance ${esc(nomSpe(o.spe).toLowerCase())}</span></span></div>
      ${r.qs.map((q) => carteQuestionId(q, ++n, o.spe)).join("")}</section>`).join("")}`;
}
function brancherIdentite(zone, el) {
  zone.querySelectorAll(".rq-puce").forEach((a) => a.onclick = (e) => { e.preventDefault(); document.querySelector(a.getAttribute("href"))?.scrollIntoView({ behavior: "smooth", block: "start" }); });
  const R = S.ident.reponses; const rerendre = () => { const y = window.scrollY; renderIdentite(el); window.scrollTo(0, y); };
  zone.querySelectorAll("input[type=checkbox][data-k]").forEach((c) => c.onchange = () => {
    const k = c.dataset.k; const r = (R[k] ||= {}); const v = r.v || [];
    r.v = c.checked ? [...v.filter((x) => x !== c.value), c.value] : v.filter((x) => x !== c.value);
    if (!r.v.includes("Autre")) delete r.autre;
    saveIdentite(); rerendre();
  });
  zone.querySelectorAll("input[type=radio][data-k]").forEach((c) => c.onchange = () => { (R[c.dataset.k] ||= {}).v = [c.value]; saveIdentite(); rerendre(); });
  zone.querySelectorAll("input[data-c]").forEach((c) => c.oninput = () => { const r = (R[c.dataset.k] ||= {}); r.c ||= []; r.c[+c.dataset.c] = c.value; saveIdentite(); const pn = zone.querySelector(".ph-prenom"); if (c.dataset.k.startsWith("PE01|")) { if (pn) pn.textContent = c.value.trim() || "Votre client rêvé"; zone.querySelectorAll(".rq-prenom").forEach((x) => (x.textContent = c.value.trim() || "votre client rêvé")); } });
  zone.querySelectorAll("textarea[data-t]").forEach((c) => c.oninput = () => { (R[c.dataset.k] ||= {}).t = c.value; saveIdentite(); });
  zone.querySelectorAll("input[data-autre]").forEach((c) => c.oninput = () => { (R[c.dataset.k] ||= {}).autre = c.value; saveIdentite(); });
  zone.querySelectorAll("input[data-c], textarea[data-t], input[data-autre]").forEach((c) => c.onblur = () => majOngletsId(el));
}
function majOngletsId(el) { el.querySelectorAll("[data-bloc]").forEach((b) => { const x = ongletsId(S.section === "branding" ? "branding" : "identite").find((o) => o.id === b.dataset.bloc); const s = b.querySelector("span"); if (s && x?.total) s.textContent = `${x.n}/${x.total}`; }); }

S.att = S.att || {};
function attente(cle, titre, duree, note) {
  S.att[cle] ||= Date.now();
  return `<div class="attente" data-cle="${cle}" data-duree="${duree}" role="status" aria-live="polite">
    <div class="att-anneau"><svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="52" class="att-fond"/><circle cx="60" cy="60" r="52" class="att-arc" pathLength="100" stroke-dasharray="0 100"/></svg><span class="att-pct">0 %</span></div>
    <div class="pile" style="gap:.35rem"><strong class="att-titre">${esc(titre)}</strong><span class="att-msg">${esc((MSG_ATTENTE[cle] || MSG_ATTENTE.studio)[0])}</span>${note ? `<span class="petit discret">${esc(note)}</span>` : ""}</div></div>`;
}
setInterval(() => {
  const vus = new Set();
  document.querySelectorAll(".attente").forEach((e) => {
    const cle = e.dataset.cle; vus.add(cle); const t = (Date.now() - (S.att[cle] ||= Date.now())) / 1000;
    const pct = Math.min(97, Math.round(97 * (1 - Math.exp(-t / (+e.dataset.duree / 2.2)))));
    e.querySelector(".att-arc").setAttribute("stroke-dasharray", `${pct} 100`); e.querySelector(".att-pct").textContent = `${pct} %`;
    const m = MSG_ATTENTE[cle] || MSG_ATTENTE.studio; e.querySelector(".att-msg").textContent = m[Math.min(m.length - 1, Math.floor(t / 12))];
  });
  Object.keys(S.att).forEach((k) => { if (!vus.has(k)) delete S.att[k]; });
}, 400);

    ${secs.map((x, k) => { const ed = S.carteEdit === x.id; return `<section class="ci-section ${x.persona ? "persona" : ""} ${ed ? "edition" : ""}" id="ci-${x.id}">
      <div class="ci-tete">${x.persona ? `<span class="ci-avatar">${ico("personne", "")}</span><div><p class="ci-sur">Persona · ${esc(x.sur || "")}</p><h2 class="ci-prenom">${esc(x.titre)}</h2></div>` : `<span class="ci-pastille ${["rose", "peche", "sauge"][k % 3]}">${ico(ICO_CARTE[x.id] || "etoile", "")}</span><div><p class="ci-sur">${String(k + 1).padStart(2, "0")} · Ma carte</p><h2>${titreCarte(x.titre)}</h2></div>`}
        <button class="bouton ${ed ? "principal" : "secondaire"} petit-btn ci-modif" data-ci="${x.id}">${ed ? "Enregistrer" : `${ico("crayon", "")}Corriger`}</button></div>
      <div class="ci-corps">${ed ? x.edition() : x.lecture()}</div></section>`; }).join("")}
    <div class="ligne"><button class="bouton principal" id="valider">${S.ident.statut === "validee" ? "Enregistrer mes corrections" : "Valider ma carte"}</button><button class="bouton secondaire" id="maj-bas">Mettre à jour ma carte</button><button class="lien" id="generer">Repartir de zéro</button></div><div id="gen-etat"></div>`;

  zone.querySelectorAll("[data-ci]").forEach((b) => b.onclick = async () => {
    const id = b.dataset.ci;
    if (S.carteEdit === id) {

  });

  });

    (S.ident.reponses._precisions ??= {})[t.dataset.precision] = t.value; saveIdentite();

      await sb.from("bilan_identite").upsert({ member_id: S.uid, reponses: S.ident.reponses, carte: S.ident.carte, updated_at: new Date().toISOString() });
      const r = await callFn("agent-identite", { mise_a_jour: true, carte: S.ident.carte, precisions: S.ident.reponses._precisions || {} });
      Object.assign(S.ident, { carte: r.carte, statut: "carte_proposee" }); renderCarte(zone); window.scrollTo(0, 0);
    } catch (e) { etat.innerHTML = `<div class="message erreur">${esc(e.message)}</div>`; b.disabled = false; }
  };
  document.getElementById("valider").onclick = async () => {
    const now = new Date().toISOString();
    const { error } = await sb.from("bilan_identite").upsert({ member_id: S.uid, reponses: S.ident.reponses, carte: S.ident.carte, statut: "validee", valide_at: now, updated_at: now });
    if (error) return alert(error.message);
    Object.assign(S.ident, { statut: "validee", valide_at: now }); renderCarte(zone); window.scrollTo(0, 0);
  };
  document.getElementById("maj-bas").onclick = () => { document.querySelector(".maj-carte").scrollIntoView({ behavior: "smooth" }); document.getElementById("maj-carte").click(); };
  brancherGenerer(zone);
}
function brancherGenerer(zone) {
  const b = document.getElementById("generer"); if (!b) return;
  b.onclick = async () => {
    if (S.ident.carte && !confirm("Repartir de zéro remplace votre carte actuelle et toutes vos corrections. Pour garder vos corrections, utilisez plutôt « Mettre à jour ma carte ». Continuer ?")) return;
    b.disabled = true; await saveIdentite(true);
    const etat = document.getElementById("gen-etat");
    etat.innerHTML = attente("carte", "Votre carte d'identité s'écrit", 70, "Comptez environ une minute. Vous pouvez quitter cette page : votre carte vous attendra à votre retour.");
    try { const r = await callFn("agent-identite", {}); Object.assign(S.ident, { carte: r.carte, statut: "carte_proposee" }); renderCarte(zone); window.scrollTo(0, 0); }
    catch (e) { etat.innerHTML = `<div class="message erreur">${esc(e.message)}</div>`; b.disabled = false; }
  };
}

function screenLogin(msg = "") {
  app.innerHTML = `<div class="carte pile" style="max-width:460px;margin:2rem auto">
    <h1 class="equerre">Connexion</h1><p class="discret">Version de test du bilan visibilité.</p>
    <ol class="petit" style="margin:0;padding-left:1.2rem;display:flex;flex-direction:column;gap:.3rem"><li>Première fois : saisissez votre e-mail et un mot de passe (6 caractères minimum), puis « Créer mon compte ».</li><li>Cliquez sur le lien de l'e-mail de confirmation. La page qui s'ouvre peut afficher une erreur : c'est normal, votre compte est bien confirmé.</li><li>Revenez sur ce fichier et cliquez sur « Me connecter ».</li></ol>
    ${msg ? `<div class="message att">${esc(msg)}</div>` : ""}
    <div class="champ"><label for="em">E-mail</label><input id="em" type="email" autocomplete="email"></div>
    <div class="champ"><label for="pw">Mot de passe</label><input id="pw" type="password" autocomplete="current-password"></div>
    <div class="ligne"><button class="bouton principal" id="li">Me connecter</button><button class="bouton secondaire" id="su">Créer mon compte</button></div></div>`;
  const go = async (signup) => {
    const email = em.value.trim(), password = pw.value;
    const { error } = signup ? await sb.auth.signUp({ email, password }) : await sb.auth.signInWithPassword({ email, password });
    if (error) {
      const m = error.message || "";
      const fr = /invalid login credentials/i.test(m) ? "E-mail ou mot de passe incorrect. Si vous avez déjà créé votre compte, utilisez « Me connecter » et non « Créer mon compte »."
        : /email not confirmed/i.test(m) ? "Votre e-mail n'est pas encore confirmé : cliquez sur le lien reçu par e-mail, puis revenez ici et cliquez sur « Me connecter »."
        : /already registered|already been registered/i.test(m) ? "Un compte existe déjà avec cet e-mail : cliquez sur « Me connecter »."
        : /password/i.test(m) ? "Choisissez un mot de passe d'au moins 6 caractères."
        : /anonymous/i.test(m) ? "Indiquez votre e-mail et un mot de passe."
        : m;
      return screenLogin(fr);
    }
    if (signup) { const { data } = await sb.auth.getSession(); if (!data.session) return screenLogin("Compte créé. Ouvrez l'e-mail de confirmation et cliquez sur le lien : la page qui s'ouvre peut afficher une erreur, c'est normal. Revenez ensuite sur ce fichier et cliquez sur « Me connecter »."); }
    boot();
  };
  li.onclick = () => go(false); su.onclick = () => go(true);
}

  // Menu du haut : Bilans, Programme personnalisé, Studio création, Ressources
  const cle = S.section === "ressources" ? "ressources" : ["tableau", "programme", "mission"].includes(S.section) ? "programme" : "bilan";
  ["bilan", "programme", "ressources"].forEach((k) => { const el = document.getElementById("nav-" + k); if (!el) return; if (k === cle) el.setAttribute("aria-current", "page"); else el.removeAttribute("aria-current"); });
  const st = document.getElementById("nav-studio"); if (st) st.hidden = FORMULE !== "complete";
  // Sur téléphone, le menu défile : on centre l'entrée active
  const act = document.getElementById("nav-" + cle), nav = act?.parentElement;
  if (nav && nav.scrollWidth > nav.clientWidth) nav.scrollLeft = act.offsetLeft - nav.offsetLeft - (nav.clientWidth - act.offsetWidth) / 2;
}
async function loadRessources() {
  const { data, error } = await sb.from("bilan_ressources").select("*").eq("actif", true).order("ordre");
  S.ressources = error ? null : data || [];
  const depuis = new Date(Date.now() - 3 * 3600e3).toISOString();
  const [{ data: ev, error: e1 }, { data: ins }] = await Promise.all([
    sb.from("bilan_evenements").select("*").gte("debut", depuis).order("debut").limit(3),
    sb.from("bilan_inscriptions").select("evenement_id"),
  ]);
  S.evenements = e1 ? [] : ev || [];
  S.inscriptions = new Set((ins || []).map((x) => x.evenement_id));
}
const accesOk = (r) => (NIVEAU_FORMULE[FORMULE] ?? 2) >= (NIVEAU_ACCES[r.acces] ?? 0);

    { k: "visibilite", sur: "Bilan", titre: "Ma visibilité", illu: ICONES_ETAPES.analyse, txt: "Votre fiche, Google et les IA, votre site, vos réseaux et votre bouche-à-oreille : une analyse détaillée et votre programme, une mission par semaine.", ...v },
    S.ident && { k: "branding", sur: "Bilan", titre: "Mon personal branding", illu: ICONES_ETAPES.identite, txt: "Votre parcours, votre façon de travailler, ce que disent vos familles, votre personnalité : votre portrait, ce qui vous rend unique.", etat: S.ident.portrait ? "Portrait prêt" : pb.t && pb.n >= pb.t ? "Toutes les questions sont remplies" : `${pb.n} réponse${pb.n > 1 ? "s" : ""} sur ${pb.t}`, complet: !S.ident.portrait && pb.t > 0 && pb.n >= pb.t, pct: S.ident.portrait ? 100 : fait(pb.n, pb.t), cta: S.ident.portrait ? "Voir mon portrait" : pb.t && pb.n >= pb.t ? "Créer mon portrait" : pb.n ? "Continuer" : "Commencer" },
    S.ident && { k: "identite", sur: "Bilan", titre: "Mon identité", illu: ILL.identite, txt: "Où vous travaillez, vos personas, votre style et votre voix : votre carte d'identité, qui guide tous les studios de création.", etat: S.ident.statut === "validee" ? "Carte d'identité validée" : S.ident.carte ? "Carte d'identité prête" : id.t && id.n >= id.t ? "Toutes les questions sont remplies" : `${id.n} réponse${id.n > 1 ? "s" : ""} sur ${id.t}`, complet: !S.ident.carte && id.t > 0 && id.n >= id.t, pct: S.ident.carte ? 100 : fait(id.n, id.t), cta: S.ident.carte ? "Voir ma carte" : id.t && id.n >= id.t ? "Créer ma carte d'identité" : id.n ? "Continuer" : "Commencer" },
  ].filter(Boolean);
  return `<section class="bilans">${cartes.map((c, k) => `<button class="bilan-carte" data-bilan="${c.k}" style="--i:${k}">
      <span class="bilan-illu ${["rose", "peche", "sauge"][k % 3]}"><img src="${c.illu}" alt=""></span>
      <span class="bilan-sur"><span class="bilan-num">${String(k + 1).padStart(2, "0")}</span>${c.sur}</span><span class="bilan-titre">${c.titre}</span><span class="bilan-txt">${c.txt}</span>
      <span class="bilan-etat ${c.complet ? "est-complet" : ""}"><span class="jauge ${c.pct === 100 ? "complete" : ""}"><span style="width:${c.pct}%"></span></span>${c.complet ? `<span class="bilan-complet">${chipComplet()}<span>${c.etat}</span></span>` : `<span>${c.etat}</span>`}</span>
      <span class="bilan-cta">${c.cta} <span aria-hidden="true">→</span></span></button>`).join("")}</section>`;
}
function screenHome() {
  const enCours = !!S.bilan;
  const pret = !!S.dernierPlan;
  const coche = '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="11" fill="currentColor"/><path d="m7.5 12.3 3 3 6-6.3" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  app.innerHTML = `<section class="accueil-tete">
      <div class="accueil-intro">
        <p class="surtitre-p">Votre espace</p>
        <h1>Vos <span class="manuscrit">bilans</span></h1>
        <p class="chapo">Trois bilans, trois regards sur votre activité : votre visibilité, ce qui vous rend unique, et le client que vous voulez attirer. Ensemble, ils construisent votre programme et nourrissent nos studios de création.</p>
        ${enCours ? `<div class="ligne"><button class="bouton principal" id="reprendre">${pret ? "Ouvrir mon tableau de bord" : "Reprendre mon bilan"}</button></div>` : ""}
        ${!enCours || pret ? `<div class="depart"><label class="confirme"><input type="checkbox" id="fiche-ok"> Ma fiche Mon Photographe Bébé est complète</label>
          <button class="bouton ${enCours ? "secondaire" : "principal"}" id="nouveau" disabled>${enCours ? "Commencer un nouveau bilan" : "Commencer mon bilan"}</button></div>` : ""}
      </div>
      <aside class="fiche-encart">
        <div class="fiche-tete"><span class="etoile-b"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 2.8 2.8 5.7 6.3.9-4.6 4.4 1.1 6.2L12 17.1 6.4 20l1.1-6.2L2.9 9.4l6.3-.9z" fill="currentColor"/></svg></span>
          <div class="pile" style="gap:.3rem"><span class="surtitre-p">Étape indispensable</span><h2>Votre fiche Mon Photographe Bébé est-elle complète ?</h2></div></div>
        <p class="petit">Pour que votre bilan soit fiable, notre outil d'analyse lit votre fiche en premier, telle que les parents la voient. Si elle est incomplète, l'analyse sera limitée.</p>
        <ul class="coches-f">${["Votre portrait", "Votre présentation", "Vos 3 photos de couverture", "Votre zone et vos lieux", "Votre tarif, durée et photos", "Vos options et votre livraison"].map((x) => `<li>${coche}<span>${x}</span></li>`).join("")}</ul>
        <div class="fiche-actions"><a class="bouton principal" href="${LIEN_MODIFIER_FICHE}" ${LIEN_MODIFIER_FICHE.startsWith("http") ? 'target="_blank" rel="noopener"' : ""}>Vérifier et compléter ma fiche <span aria-hidden="true">→</span></a>
          <span class="fiche-note">Quelques minutes<br>et c'est fait !</span></div>
      </aside>
    </section>
    ${bravoBilans()}
    ${blocBilans()}
    ${encartStudio()}
    ${parcoursFormule()}`;
  const ok = document.getElementById("fiche-ok"), nv = document.getElementById("nouveau");
  if (ok && nv) ok.onchange = () => { nv.disabled = !ok.checked; };
  app.querySelectorAll("[data-bravo]").forEach((b) => b.onclick = () => {
    const k = b.dataset.bravo;
    if (k === "portrait") { S.pbBloc = "portrait"; return allerA("branding"); }
    if (k === "carte") { S.idBloc = "carte"; return allerA("identite"); }
    allerA(k);
  });
  app.querySelectorAll("[data-bilan]").forEach((b) => b.onclick = () => {
    const k = b.dataset.bilan;
    if (k === "visibilite") return S.bilan ? allerA(S.dernierPlan ? "synthese" : prochaineEtape()) : document.getElementById("fiche-ok")?.focus();
    if (k === "branding") { S.pbBloc = S.ident?.portrait ? "portrait" : S.pbBloc; return allerA("branding"); }
    if (k === "identite") { S.idBloc = S.ident?.carte ? "carte" : S.idBloc; return allerA("identite"); }
  });
  const gr = document.getElementById("go-ressources"); if (gr) gr.onclick = () => allerA("ressources");
  const rep = document.getElementById("reprendre");
  if (rep) rep.onclick = () => allerA(S.planMissions?.length ? "tableau" : prochaineEtape());
  if (nv) nv.onclick = async () => {
    if (enCours && !confirm("Un nouveau bilan repart de zéro, avec de nouvelles questions et une nouvelle analyse. Votre bilan actuel reste enregistré. Continuer ?")) return;
    const { data, error } = await sb.from("bilan_bilans").insert({}).select().single();
    if (error) return alert(error.message);
    S.bilan = data; S.rep = new Map(); S.constats = []; S.result = null; S.complet = false; S.aUnPlan = false; S.dernierPlan = null; S.relancer = false; S.erreursAnalyse = []; S.planMissions = []; S.suivi = new Map(); allerA("contexte");
  };
}
// Lien depuis une fiche PDF (QR code) : #mission-MG09 ouvre directement la mission, avec sa vidéo
function ouvrirLienFiche() {
  const id = ((location.hash || "").match(/^#mission[-\/]([A-Za-z0-9-]+)$/) || [])[1]?.toUpperCase();
  if (!id || !S.missions?.[id]) return;
  try { history.replaceState(null, "", location.pathname + location.search); } catch { /* sans historique */ }
  ouvrirMission(id);
}
async function boot() {
  const who = document.getElementById("who"), logout = document.getElementById("logout");
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { who.textContent = ""; logout.hidden = true; return screenLogin(); }
  who.textContent = session.user.email; logout.hidden = false;
  logout.onclick = async () => { await sb.auth.signOut(); boot(); };
  document.getElementById("nav-ressources").onclick = (e) => { e.preventDefault(); if (S.cat) allerA("ressources"); };
  document.getElementById("nav-bilan").onclick = (e) => { e.preventDefault(); if (!S.cat) return; S.section = null; majNav(); screenHome(); window.scrollTo(0, 0); };
  document.getElementById("nav-programme").onclick = (e) => { e.preventDefault(); if (!S.cat) return; if (S.planMissions?.length) return allerA("programme"); S.section = null; majNav(); screenHome(); window.scrollTo(0, 0); };
  document.getElementById("nav-studio").onclick = (e) => { e.preventDefault(); if (S.cat) ouvrirStudioContenu(); };
  majNav();
  try { if (!S.cat) await loadCatalogue(); await loadBilan(); screenHome(); ouvrirLienFiche(); installerStudioContenu(); }
  catch (e) { app.innerHTML = `<div class="message erreur">${esc(e.message)}</div>`; }
}
boot();
</script>
</body>
</html>
