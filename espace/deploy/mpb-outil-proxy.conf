# À copier dans /etc/nginx/mpb-outil-proxy.conf
proxy_http_version 1.1;
proxy_set_header Host $host;                    # le serveur refuse tout autre hôte que bilan.monphotographebebe.fr
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_buffering off;                             # réponses privées : rien en cache
proxy_cache off;
proxy_hide_header X-Powered-By;
