# Vhost de l'outil d'analyse. À installer à côté du vhost du Pro, puis : nginx -t && systemctl reload nginx
# Pas de journalisation des URL de connexion (code, state) ni des en-têtes Authorization/Cookie.
log_format mpb_outil '$remote_addr [$time_local] "$request_method $uri" $status $body_bytes_sent $request_time';

server {
  listen 80;
  server_name bilan.monphotographebebe.fr;
  return 301 https://bilan.monphotographebebe.fr$request_uri;
}

server {
  listen 443 ssl http2;
  server_name bilan.monphotographebebe.fr;
  ssl_certificate     /etc/letsencrypt/live/bilan.monphotographebebe.fr/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/bilan.monphotographebebe.fr/privkey.pem;

  access_log /var/log/nginx/bilan-access.log mpb_outil;     # $uri sans query string
  client_max_body_size 16m;                                  # images envoyées aux studios de création
  proxy_read_timeout 200s;                                   # analyse du site : jusqu'à ~2 minutes

  # Le callback et la connexion ne sont jamais journalisés
  location /auth/ { access_log off; proxy_pass http://127.0.0.1:8081; include /etc/nginx/mpb-outil-proxy.conf; }
  location / { proxy_pass http://127.0.0.1:8081; include /etc/nginx/mpb-outil-proxy.conf; }
}
